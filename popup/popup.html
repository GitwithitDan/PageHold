<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PageHold</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f2eb;
      color: #0a0a0f;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(10, 10, 15, 0.08);
    }

    .icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #1e3a8a, #4c1d95);
      border-radius: 10px;
      display: grid;
      place-items: center;
    }

    .icon svg {
      width: 20px;
      height: 20px;
      stroke: #a5b4fc;
      fill: none;
      stroke-width: 2;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .toggle-section {
      background: rgba(10, 10, 15, 0.04);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toggle-label {
      font-size: 14px;
      font-weight: 500;
    }

    .toggle-switch {
      position: relative;
      width: 48px;
      height: 26px;
      background: rgba(10, 10, 15, 0.12);
      border-radius: 99px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle-switch.active {
      background: #6366f1;
    }

    .toggle-knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle-switch.active .toggle-knob {
      transform: translateX(22px);
    }

    .info {
      font-size: 13px;
      line-height: 1.6;
      color: rgba(10, 10, 15, 0.6);
      margin-bottom: 16px;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat {
      background: rgba(10, 10, 15, 0.04);
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 600;
      display: block;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 11px;
      color: rgba(10, 10, 15, 0.5);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">
      <svg viewBox="0 0 24 24">
        <path d="M5 2h14M5 22h14M7 2v5l5 5-5 5v5M17 2v5l-5 5 5 5v5" 
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>PageHold</h1>
  </div>

  <div class="toggle-section">
    <div class="toggle-row">
      <span class="toggle-label">Enable PageHold</span>
      <div class="toggle-switch active" id="toggle">
        <div class="toggle-knob"></div>
      </div>
    </div>
  </div>

  <div class="info">
    PageHold prevents layout shifts by holding pages behind a loading screen until fully ready. Toggle off to disable on all sites.
  </div>

  <div class="stats">
    <div class="stat">
      <span class="stat-value">8s</span>
      <span class="stat-label">Max Hold</span>
    </div>
    <div class="stat">
      <span class="stat-value">0</span>
      <span class="stat-label">Data Collected</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
